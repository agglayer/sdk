name: Release Packages
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'NPM dist-tag channel to publish to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - alpha
          - beta
          - latest
      branch:
        description: 'Branch to release from'
        required: false
        default: 'main'
      force:
        description: 'Force release even if version exists'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release + tag
      id-token: write # OIDC trusted publishing — npm exchanges a short-lived token, no secret needed
    steps:
      - name: Validate Inputs
        run: |
          echo "🔍 Validating release inputs..."

          # Validate branch - only main and develop allowed
          if [[ "${{ github.event.inputs.branch }}" != "main" && "${{ github.event.inputs.branch }}" != "develop" ]]; then
              echo "❌ Error: Can only release from 'main' or 'develop' branches"
              echo "Current branch: ${{ github.event.inputs.branch }}"
              exit 1
          fi

          # Validate channel-branch combination
          if [[ "${{ github.event.inputs.channel }}" == "latest" && "${{ github.event.inputs.branch }}" != "main" ]]; then
              echo "❌ Error: 'latest' channel can ONLY be released from 'main' branch"
              echo "🚫 Stable releases are restricted to main branch only"
              exit 1
          fi

          # Validate develop branch restrictions
          if [[ "${{ github.event.inputs.branch }}" == "develop" && "${{ github.event.inputs.channel }}" == "latest" ]]; then
              echo "❌ Error: 'develop' branch cannot make stable releases"
              echo "💡 Use 'alpha', 'dev', or 'beta' channels for develop branch"
              exit 1
          fi

          echo "✅ Input validation passed"
          echo "📦 Channel: ${{ github.event.inputs.channel }}"
          echo "🌿 Branch: ${{ github.event.inputs.branch }}"
          echo "💪 Force: ${{ github.event.inputs.force }}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch || 'main' }}

      # Bun runs install, quality checks, build and tests.
      - uses: oven-sh/setup-bun@v1

      # Node + the npm CLI are required for OIDC trusted publishing and staged
      # releases — bun cannot perform npm's OIDC token exchange. registry-url is
      # what wires npm up to the public registry; no auth token is configured.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm CLI
        run: |
          echo "⬆️ Upgrading npm to guarantee trusted-publishing + staging support..."
          # Trusted publishing needs npm >= 11.5.1; staged publishing needs >= 11.15.0.
          npm install -g npm@latest
          echo "📦 npm version: $(npm --version)"

      - name: Install Dependencies
        run: |
          echo "📦 Installing dependencies..."
          bun install --frozen-lockfile
          echo "✅ Dependencies installed"

      - name: Run Quality Checks
        run: |
          echo "🔍 Running quality checks..."

          # Type checking
          echo "📝 Type checking..."
          bun run typecheck

          # Linting
          echo "🧹 Linting..."
          bun run lint

          # Format checking
          echo "💅 Format checking..."
          bun run format:check

          echo "✅ Quality checks passed"

      - name: Build Packages
        run: |
          echo "🏗️ Building packages..."
          bun run build

          # Verify build output
          if [[ ! -d "dist" ]]; then
              echo "❌ Error: Build output directory 'dist' not found"
              exit 1
          fi

          echo "✅ Packages built successfully"

      - name: Run Tests
        run: |
          echo "🧪 Running tests..."
          bun run test:run

          # Run coverage if available
          if bun run test:coverage 2>/dev/null; then
              echo "📊 Test coverage generated"
          fi

          echo "✅ All tests passed"

      - name: Check Existing Version
        if: ${{ github.event.inputs.force != 'true' }}
        run: |
          echo "🔍 Checking if version already exists on NPM..."

          # `npm view` is a public read — no authentication required.
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "📦 Current version: $CURRENT_VERSION"

          # Check if version exists on the target channel
          if npm view @agglayer/sdk@${{ github.event.inputs.channel }} version 2>/dev/null | grep -q "$CURRENT_VERSION"; then
              echo "❌ Error: Version $CURRENT_VERSION already exists on ${{ github.event.inputs.channel }} channel"
              echo "💡 Use 'force: true' to override this check"
              exit 1
          fi

          echo "✅ Version $CURRENT_VERSION is available for release"

      - name: Stage Publish to NPM
        run: |
          echo "🚀 Staging release via trusted publishing (OIDC)..."

          # Set release channel
          DIST_TAG="${{ github.event.inputs.channel }}"
          echo "📦 Staging to channel: $DIST_TAG"

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "📋 Current version: $CURRENT_VERSION"

          # Staged publishing: the package is uploaded to a staging queue instead
          # of going live. A maintainer must approve it with a 2FA challenge
          # before it becomes publicly installable. Authentication is handled by
          # OIDC — there is no NPM_TOKEN. Provenance is generated automatically
          # when publishing from a trusted GitHub Actions workflow.
          echo "📝 Staging package to NPM..."
          npm stage publish --tag "$DIST_TAG"

          echo "✅ Package staged successfully — pending maintainer approval"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIST_TAG="${{ github.event.inputs.channel }}"
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          # Set release notes based on channel
          case "$DIST_TAG" in
              "latest")
                  RELEASE_NOTES="🚀 Stable release"
                  ;;
              "beta")
                  RELEASE_NOTES="🧪 Beta release - testing phase"
                  ;;
              "dev")
                  RELEASE_NOTES="🔧 Development release - experimental features"
                  ;;
              "alpha")
                  RELEASE_NOTES="⚡ Alpha release - early access features"
                  ;;
          esac

          echo "📝 Creating GitHub release..."
          gh release create "v$CURRENT_VERSION" \
            --title "Release v$CURRENT_VERSION" \
            --notes "$RELEASE_NOTES"

          echo "✅ GitHub release created"

      - name: Staging Summary
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "⏳ Release v$CURRENT_VERSION is STAGED and pending approval"
          echo "=================================================="
          echo "The package has been uploaded to NPM's staging queue but is NOT"
          echo "yet publicly installable. A maintainer must approve it with a 2FA"
          echo "challenge to release it:"
          echo ""
          echo "  • Web:  https://www.npmjs.com/package/@agglayer/sdk"
          echo "  • CLI:  run 'npm stage --help' for the approval commands"
          echo ""
          echo "Once approved, install with:"
          echo "  npm install @agglayer/sdk@${{ github.event.inputs.channel }}"
          echo "=================================================="

      - name: Create Release Summary
        if: always()
        run: |
          echo "📋 Release Summary"
          echo "=================="
          echo "Channel: ${{ github.event.inputs.channel }}"
          echo "Branch: ${{ github.event.inputs.branch }}"
          echo "Force: ${{ github.event.inputs.force }}"
          echo "=================="

          if [[ "${{ job.status }}" == "success" ]]; then
              echo "🎉 Release staged successfully — awaiting maintainer approval!"
          else
              echo "❌ Release failed. Check the logs above for details."
          fi

      - name: Failure Notice
        if: failure()
        run: |
          echo "🔄 Release workflow failed"
          echo "ℹ️  Staged publishing means nothing is public until a maintainer"
          echo "    approves it, so a failed run does not expose a partial release."
          echo "📝 If a GitHub release/tag was created before the failure, remove it"
          echo "    manually if you do not intend to retry this version."
